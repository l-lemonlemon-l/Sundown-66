# Builds every version of Sundown 66 and attaches them to a GitHub release.
# Runs when you push a tag like v1.4.1, or by hand from the Actions tab.
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   Mac, signed and notarized by Apple (needs a paid Apple Developer account):
#     MAC_CERT_P12_BASE64   Developer ID Application certificate, exported as .p12, base64
#     MAC_CERT_PASSWORD     password of that .p12
#     APPLE_ID              Apple ID email
#     APPLE_APP_PASSWORD    app-specific password from appleid.apple.com
#     APPLE_TEAM_ID         10-character team ID
#   Android, so updates install over older versions:
#     ANDROID_KEYSTORE_BASE64  the release keystore, base64
# Without the Mac secrets the Mac app is signed ad hoc; install it with install-mac.sh.
name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Import Developer ID certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
      - name: Build Mac apps
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          mkdir -p game && cp ../index.html game/index.html
          node build-mac.js
          ditto -c -k --sequesterRsrc --keepParent "dist/Sundown 66-darwin-arm64/Sundown 66.app" ../Sundown66-Mac-AppleSilicon.zip
          ditto -c -k --sequesterRsrc --keepParent "dist/Sundown 66-darwin-x64/Sundown 66.app" ../Sundown66-Mac-Intel.zip
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: 'Sundown66-Mac-*.zip' }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build Windows app
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          mkdir -p game && cp ../index.html game/index.html
          npx electron-packager . "Sundown 66" --platform=win32 --arch=x64 --out=dist --overwrite --ignore='^/dist'
          cd dist && 7z a -tzip ../../Sundown66-Windows.zip "Sundown 66-win32-x64"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Sundown66-Windows.zip }
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install -y aapt apksigner zipalign dalvik-exchange android-sdk-platform-23 default-jdk
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/sundown.keystore; fi
          ./android/build.sh
          mv android/Sundown66.apk Sundown66-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Sundown66-Android.apk }
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Sundown 66 ${{ github.ref_name }}" --generate-notes Sundown66-*.zip Sundown66-Android.apk
